# Déploie automatiquement la base et la fonction Supabase.
# Se déclenche à chaque push sur main qui modifie le dossier supabase/
# (un changement uniquement front-end ne lance rien). Peut aussi être lancé à la main
# depuis l'onglet Actions de GitHub (« Run workflow »).
#
# Prérequis : un secret GitHub SUPABASE_ACCESS_TOKEN
# (jeton créé sur https://supabase.com/dashboard/account/tokens).
name: Déploiement Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: tqpdsgvdiuwsexpzkqwk
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le jeton Supabase
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Ajoute le secret SUPABASE_ACCESS_TOKEN dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Appliquer les migrations
        run: supabase db push --remote="$PROJECT_REF" --yes

      - name: Déployer la fonction api
        run: supabase functions deploy api --no-verify-jwt --remote="$PROJECT_REF" --yes
